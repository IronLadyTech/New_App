services:
  - type: web
    name: il-guide-api
    runtime: python
    rootDir: il-guide-api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: IL_GUIDE_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_OTP_TEMPLATE
        value: login_otp
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
